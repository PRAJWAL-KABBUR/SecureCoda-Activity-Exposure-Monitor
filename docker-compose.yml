services:
  db:
    image: mysql:8.0
    container_name: securecoda_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: iamPK@1998
      MYSQL_DATABASE: securecoda
    ports:
      - "3307:3306"
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: securecoda_app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/securecoda?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ####
    depends_on:
      db:
        condition: service_healthy
